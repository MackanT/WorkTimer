services:
  worktimer:
    build: .
    image: worktimer-app:latest
    ports:
      # Host-side bind address, localhost by default: the app has no login and
      # the database holds tracker credentials, so network exposure is opt-in.
      # Set HOST=0.0.0.0 in .env to reach it from other devices on the LAN —
      # the same switch the bare-metal install uses.
      - "${HOST:-127.0.0.1}:8080:8080"
    environment:
      # Defaults match the app's own, so a checkout without a .env file works.
      - DB_NAME=${DB_NAME:-worktimer.db}
      - DEBUG_MODE=${DEBUG_MODE:-false}
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  # v6 database. The app above still runs on SQLite; the "postgres" profile
  # below runs a second instance on it. Start just the database (development,
  # tests): `docker compose up -d postgres`.
  postgres:
    image: postgres:18
    ports:
      # Localhost only, never on the network. (On WSL with mirrored networking,
      # an all-interfaces mapping would expose it to the whole LAN.)
      - "127.0.0.1:${PG_PORT:-5432}:5432"
    environment:
      # Development default. Anything reachable by others must set its own in .env.
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-worktimer-dev}
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/docker;
      # mounting the parent (not .../data) keeps major-version upgrades possible.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ── v6 on Postgres (in development) — opt-in, alongside the app above ─────
  # `docker compose --profile postgres up -d --build` adds a second WorkTimer
  # on http://localhost:8090, running on Postgres with an empty database (5.x
  # data arrives with the importer). A plain `docker compose up -d` leaves both
  # services out.

  # One-shot setup, as the admin role: creates the database if missing,
  # applies migrations and gives the app's roles their logins.
  migrate:
    build: .
    image: worktimer-app:latest
    profiles: ["postgres"]
    entrypoint: ["uv", "run", "-m", "src.migrator"]
    environment:
      - DATABASE_URL_ADMIN=postgresql://postgres:${POSTGRES_PASSWORD:-worktimer-dev}@postgres:5432/worktimer
      - WORKTIMER_APP_PASSWORD=${WORKTIMER_APP_PASSWORD:-worktimer-app-dev}
      - WORKTIMER_READONLY_PASSWORD=${WORKTIMER_READONLY_PASSWORD:-worktimer-readonly-dev}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  worktimer-pg:
    build: .
    image: worktimer-app:latest
    profiles: ["postgres"]
    ports:
      - "${HOST:-127.0.0.1}:${PG_APP_PORT:-8090}:8080"
    environment:
      # Setting DATABASE_URL is what switches the app to Postgres.
      - DATABASE_URL=postgresql://worktimer_app:${WORKTIMER_APP_PASSWORD:-worktimer-app-dev}@postgres:5432/worktimer
      - DATABASE_URL_READONLY=postgresql://worktimer_readonly:${WORKTIMER_READONLY_PASSWORD:-worktimer-readonly-dev}@postgres:5432/worktimer
      - DEBUG_MODE=${DEBUG_MODE:-false}
    volumes:
      # Its own folder for the PAT key, notes and backups — never the SQLite
      # install's data/.
      - ./data-pg:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Whole-database backups (disaster recovery): pg_dump as the admin, every
  # BACKUP_INTERVAL_SECONDS (daily), newest BACKUP_KEEP kept, in ./backups-pg.
  # The app's own "Backup now" exports only the signed-in user's data.
  backup:
    image: postgres:18
    profiles: ["postgres"]
    entrypoint: ["sh", "/pg_backup.sh"]
    environment:
      - PGHOST=postgres
      - PGUSER=postgres
      - PGPASSWORD=${POSTGRES_PASSWORD:-worktimer-dev}
      - PGDATABASE=worktimer
      - BACKUP_INTERVAL_SECONDS=${BACKUP_INTERVAL_SECONDS:-86400}
      - BACKUP_KEEP=${BACKUP_KEEP:-14}
    volumes:
      - ./scripts/pg_backup.sh:/pg_backup.sh:ro
      - ./backups-pg:/backups
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
