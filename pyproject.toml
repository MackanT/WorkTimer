[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "worktimer"
version = "5.0.4"
authors = [
  { name = "Marcus Toftås", email = "mackan.toftas@live.com" }
]
maintainers = [
  { name = "Marcus Toftås", email = "mackan.toftas@live.com" }
]
description = "A helper program to keep time of time spent on different tasks, with built in DevOps integration."
readme = "docs/README.md"
requires-python = ">=3.11"
dependencies = [
    "azure-devops>=7.1.0b4",
    "msrest>=0.7.1",
    "nicegui>=2.24.1",
    "pandas>=2.3.2",
    "markdown>=3.4.4",
    "bleach>=6.0.0",
    "markdownify>=1.2.0",
    "pygments>=2.15.0",
    "pymdown-extensions>=10.21.2",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "packaging>=21.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/MackanT/WorkTimer"
"Bug Tracker" = "https://github.com/MackanT/WorkTimer"

# NOTE: no [project.scripts] entry point — the previous "src.main:main" pointed
# at a module that doesn't exist (main.py lives at the repo root and isn't
# packaged). Run the app from a checkout with `python main.py`.

[tool.uv]
# Don't build/install worktimer as a package into the venv. It's run from the
# working tree (`python main.py`, imports `src.*`) and never imported as an
# installed package — so building it only churned the venv and, inside OneDrive,
# intermittently failed with "Access is denied" on the dist-info during sync.
package = false

[dependency-groups]
# Installed by `uv sync` (the dev group is on by default). Run: `uv run pytest`
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the repo root on sys.path so tests can `from src.<module> import ...`
# (src is an implicit namespace package used the same way main.py imports it).
pythonpath = ["."]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
